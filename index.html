    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://www.buildconhouse.com/" />
    <meta property="og:image" content="https://www.buildconhouse.com/images/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Buildcon House — premium sanitaryware, tiles, kitchens, wellness and furniture in Rajkot" />

    <meta name="twitter:image" content="https://www.buildconhouse.com/images/og-cover.jpg" />
