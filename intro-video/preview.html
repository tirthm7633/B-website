<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050607" />
<title>Intro Preview</title>
<style>
  :root {
    --bg: #050607;
    --text: #e8ecf1;
    --muted: #8a929c;
    --line: #2a313b;
    --accent: #7fa3c7;
    --panel: rgba(12, 15, 19, 0.86);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; height: 100dvh; display: grid; place-items: center; background: var(--bg); }
  video { width: 100%; height: 100%; object-fit: contain; background: var(--bg); display: block; }
  .panel { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(760px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(8px); transition: opacity 0.25s; }
  .panel.hidden { opacity: 0; pointer-events: none; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .row + .row { margin-top: 8px; }
  .group { display: flex; align-items: center; gap: 4px; }
  .group > span { color: var(--muted); margin-right: 2px; }
  button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 32px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #050607; }
  .info { color: var(--muted); font-size: 12px; word-break: break-word; }
  .info b { color: var(--text); font-weight: 600; }
  .hint { color: var(--muted); font-size: 11px; margin-left: auto; }
</style>
</head>
<body>
<div class="stage">
  <video id="v" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
</div>

<div class="panel" id="panel">
  <div class="row">
    <div class="group" data-key="aspect"><span>Aspect</span>
      <button data-v="auto">Auto</button><button data-v="16x9">16:9</button><button data-v="4x3">4:3</button><button data-v="3x4">3:4</button><button data-v="9x16">9:16</button>
    </div>
    <div class="group" data-key="version"><span>Cut</span>
      <button data-v="full">Full 8.5s</button><button data-v="short">Short 2.5s</button>
    </div>
  </div>
  <div class="row">
    <div class="group" data-key="tier"><span>Tier</span>
      <button data-v="auto">Auto</button><button data-v="hd">HD</button><button data-v="lite">LITE</button><button data-v="master">Master</button>
    </div>
    <div class="group" data-key="format"><span>Format</span>
      <button data-v="auto">WebM→MP4</button><button data-v="mp4">MP4 only</button>
    </div>
    <button id="replay">Replay</button>
  </div>
  <div class="row"><div class="info" id="info"></div><div class="hint">H hides this panel</div></div>
</div>

<script src="out/web/manifest.js"></script>
<script>
  // Same selection rules the website overlay will use (Phase 2): variant by window ratio,
  // LITE for Save-Data, 2g/3g or a short side ≤ 480 px. Unlike the site, this page re-picks on
  // resize while "Auto" is on, so the switch points can be checked by resizing the window.
  const manifest = window.INTRO_MANIFEST || []
  const state = { aspect: 'auto', version: 'full', tier: 'auto', format: 'auto' }
  const v = document.getElementById('v')
  const info = document.getElementById('info')

  function aspectFor(w, h) {
    const r = w / h
    if (r >= 1.55) return '16x9'
    if (r >= 1.1) return '4x3'
    if (r >= 0.68) return '3x4'
    return '9x16'
  }
  function autoTier(w, h) {
    const c = navigator.connection || {}
    if (c.saveData) return ['lite', 'Save-Data on']
    if (/(^|-)2g$|^3g$/.test(c.effectiveType || '')) return ['lite', `connection ${c.effectiveType}`]
    if (Math.min(w, h) <= 480) return ['lite', 'short side ≤ 480px']
    return ['hd', c.effectiveType ? `connection ${c.effectiveType}` : 'no Network Information API']
  }
  const sizeOf = (file) => {
    const row = manifest.find((r) => r.file === file)
    return row ? `${(row.size / 1e6).toFixed(2)} MB` : '—'
  }

  function load() {
    const w = window.innerWidth
    const h = window.innerHeight
    const aspect = state.aspect === 'auto' ? aspectFor(w, h) : state.aspect
    const [autoT, why] = autoTier(w, h)
    const tier = state.tier === 'auto' ? autoT : state.tier
    const id = `intro-${state.version === 'short' ? 'short-' : ''}${aspect}`
    const poster = `out/web/poster-${aspect}.jpg`
    let sources
    if (tier === 'master') sources = [{ src: `out/master/${id}.mp4`, type: 'video/mp4' }]
    else {
      sources = [
        { src: `out/web/${id}-${tier}.webm`, type: 'video/webm; codecs="vp9"' },
        { src: `out/web/${id}-${tier}.mp4`, type: 'video/mp4; codecs="avc1.640028"' },
      ]
      if (state.format === 'mp4') sources.shift()
    }
    v.poster = poster
    v.replaceChildren(...sources.map((s) => Object.assign(document.createElement('source'), s)))
    v.load()
    v.play().catch(() => {})
    const ratio = (w / h).toFixed(2)
    info.dataset.base =
      `Window <b>${w}×${h}</b> (ratio ${ratio}) → <b>${aspect}</b>${state.aspect === 'auto' ? ' (auto)' : ' (forced)'} · ` +
      `tier <b>${tier.toUpperCase()}</b>${state.tier === 'auto' ? ` (auto: ${why})` : ''}`
    renderInfo()
    for (const g of document.querySelectorAll('.group')) for (const b of g.querySelectorAll('button')) b.setAttribute('aria-pressed', String(state[g.dataset.key] === b.dataset.v))
  }
  function renderInfo() {
    const file = (v.currentSrc || '').split('/').pop()
    const playing = file ? ` · playing <b>${file}</b> ${file.endsWith('.mp4') && v.currentSrc.includes('/master/') ? '(full-quality review master)' : sizeOf(file)}` : ''
    info.innerHTML = info.dataset.base + playing
  }

  document.querySelectorAll('.group').forEach((g) =>
    g.addEventListener('click', (e) => {
      const b = e.target.closest('button')
      if (!b) return
      state[g.dataset.key] = b.dataset.v
      load()
    }),
  )
  document.getElementById('replay').addEventListener('click', () => {
    v.currentTime = 0
    v.play().catch(() => {})
  })
  v.addEventListener('loadedmetadata', renderInfo)
  let t
  window.addEventListener('resize', () => {
    clearTimeout(t)
    t = setTimeout(() => {
      if (state.aspect === 'auto' || state.tier === 'auto') load()
    }, 250)
  })
  window.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') document.getElementById('panel').classList.toggle('hidden')
    if (e.key === ' ') {
      e.preventDefault()
      v.paused ? v.play() : v.pause()
    }
  })
  if (!manifest.length) info.textContent = 'out/web/manifest.js not found — run node scripts/encode.mjs first.'
  load()
</script>
</body>
</html>
